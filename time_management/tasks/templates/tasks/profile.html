{% extends "tasks/layout.html" %}
{% load static %}

{% block head %}
<title>Profile</title>
<script src="{% static 'tasks/profile.js' %}"></script>
{% endblock %}

{% block body %}
<div class="profile-connections">
    <h1>Connections</h1>
    <div class="google-connection">
        <h2>Google</h2>
        <button id="google-button" class="button">
            Import Assignments - Google
        </button>
    </div>
    <div class="managebac-connection">
        <h2>ManageBac</h2>
        <button id="managebac-button" class="button">
            Import Assignments - ManageBac
        </button>
    </div>
</div>

<div class="managebac-modal">
    <div class="modal-content-login">
        <span class="close">&times;</span>
        <h2 class="managebac-heading">Import - ManageBac</h2>
        <form id="managebac-form">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" id="username" required placeholder=" ">
                <label for="username">Username</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" required placeholder=" ">
                <label for="password">Password</label>
            </div>
            <button type="submit" class="login-btn">Import</button>
        </form>
    </div>
</div>

<div class="managebac-modal" id="loadingModal">
    <div class="modal-content-large">
        <div class="spinner"></div>
        <p>Loading tasks...</p>
    </div>
</div>

<div class="managebac-modal" id="tasksModal">
    <div class="modal-content-large">
        <div class="task-section" id="upcomingSection">
            <h3>Upcoming Tasks</h3>
            <div class="task-list" id="upcomingList">

            </div>
            <button id="loadMoreUpcoming" class="load-more">Load More</button>
        </div>
        <div class="task-section" id="completedSection">
            <h3>Completed Tasks</h3>
            <div class="task-list" id="completedList">

            </div>
            <button id="loadMoreCompleted" class="load-more">Load More Completed</button>
        </div>
    </div>
</div>

{% endblock %}
